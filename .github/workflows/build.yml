name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: App-Name, Autor und eigenes Icon einbauen
        run: |
          mkdir -p app/src/main/java/com/example/lademodus
          mkdir -p app/src/main/res/values
          [ -f AndroidManifest.xml ] && mv AndroidManifest.xml app/src/main/
          [ -f MainActivity.kt ] && mv MainActivity.kt app/src/main/java/com/example/lademodus/
          [ -f styles.xml ] && mv styles.xml app/src/main/res/values/
          [ -f build.yml ] && rm build.yml

          unzip -q IconKitchen-Output.zip -d temp_icons
          cp -r temp_icons/android/res/* app/src/main/res/
          rm -rf temp_icons

          sed -i 's/android:icon="[^"]*"/android:icon="@mipmap\/ic_launcher"/g' app/src/main/AndroidManifest.xml
          sed -i 's/android:label="[^"]*"/android:label="Asus Rog Phone Lademodus"/g' app/src/main/AndroidManifest.xml
          sed -i 's/<\/application>/<meta-data android:name="author" android:value="Andi Ziehn" \/><meta-data android:name="developer" android:value="Andi Ziehn" \/><\/application>/g' app/src/main/AndroidManifest.xml

          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
          }
          EOF
          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }
          android {
              namespace 'com.example.lademodus'
              compileSdk 34
              defaultConfig {
                  applicationId "com.example.lademodus"
                  minSdk 26
                  targetSdk 34
                  versionCode 5
                  versionName "1.4 (Andi Ziehn)"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
          }
          EOF

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Gradle Wrapper einrichten und APK bauen
        run: |
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: Lademodus-APK
          path: app/build/outputs/apk/debug/app-debug.apk
